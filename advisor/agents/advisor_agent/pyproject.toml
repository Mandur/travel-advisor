[project]
name = "advisor-agent"
version = "0.1.0"
description = "Routing supervisor agent — orchestrates travel and meeting domain agents"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "rfp-agent",
    "property-planning-agent",
    "azure-identity>=1.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisor_agent"]

[tool.uv.sources]
shared = { workspace = true }
rfp-agent = { workspace = true }
property-planning-agent = { workspace = true }
