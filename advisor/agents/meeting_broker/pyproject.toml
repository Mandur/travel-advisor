[project]
name = "meeting-broker"
version = "0.1.0"
description = "Meeting broker agent that handles meeting scheduling and amenities requests"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "azure-identity>=1.15",
    "httpx>=0.27",
    "agent-framework>=1.0.0rc2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
shared = { workspace = true }
