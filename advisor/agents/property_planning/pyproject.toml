[project]
name = "property-planning-agent"
version = "0.1.0"
description = "Property planning agent for venue and space management"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "azure-identity>=1.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/property_planning"]

[tool.uv.sources]
shared = { workspace = true }
