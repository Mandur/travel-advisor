[project]
name = "rfp-agent"
version = "0.1.0"
description = "RFP agent for managing requests for proposals"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "meeting-broker",
    "hotelligence-advisor",
    "azure-identity>=1.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfp"]

[tool.uv.sources]
shared = { workspace = true }
meeting-broker = { workspace = true }
hotelligence-advisor = { workspace = true }
