[project]
name = "shared"
version = "0.1.0"
description = "Shared utilities and models for Foundry hosted agents"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "azure-identity>=1.15",
    "python-dotenv>=1.0",
    "azure-monitor-opentelemetry-exporter>=1.0.0b46",
    "opentelemetry-sdk>=1.39",
    # LangGraph / LangChain stack
    "langgraph>=0.3",
    "langchain-azure-ai>=0.1",
    "langchain-core>=0.3",
    "langgraph-checkpoint-postgres",
    "psycopg[binary,pool]",
    # Microsoft 365 Agents SDK — Teams / Bot Service adapter (routing-agent only)
    "microsoft-agents-hosting-core>=0.8.0",
    "microsoft-agents-hosting-fastapi>=0.8.0",
    "microsoft-agents-authentication-msal>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
