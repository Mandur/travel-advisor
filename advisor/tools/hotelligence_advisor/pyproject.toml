[project]
name = "hotelligence-advisor"
version = "0.1.0"
description = "LangChain tools wrapping the Hotelligence360 GraphQL chatbot endpoint"
requires-python = ">=3.12"
dependencies = [
    "shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotelligence_advisor"]

[tool.uv.sources]
shared = { workspace = true }
