[project]
name = "token-fatcher"
version = "0.1.0"
description = "Browser-based HOSBI token retriever utility"
requires-python = ">=3.12"
dependencies = [
    "pyppeteer==2.0.0",
    "python-dotenv>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_fatcher"]
