services:
  routing-agent:
    image: hacktrial.azurecr.io/routing-agent:${TAG:-0.0.1}
    build:
      context: .
      dockerfile: advisor/agents/advisor_agent/Dockerfile
    ports:
      - "8088:8088"
    environment:
      AZURE_AI_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_MINI_DEPLOYMENT: ${AZURE_OPENAI_MINI_DEPLOYMENT:-}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}

  travel-advisor-agent:
    image: hacktrial.azurecr.io/travel-advisor-agent:${TAG:-0.0.1}
    build:
      context: .
      dockerfile: advisor/agents/travel_advisor_agent/Dockerfile
    ports:
      - "8089:8088"
    environment:
      AZURE_AI_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_MINI_DEPLOYMENT: ${AZURE_OPENAI_MINI_DEPLOYMENT:-}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}

  meeting-broker-agent:
    image: hacktrial.azurecr.io/meeting-broker-agent:${TAG:-0.0.1}
    build:
      context: .
      dockerfile: advisor/agents/meeting_broker_agent/Dockerfile
    ports:
      - "8090:8088"
    environment:
      AZURE_AI_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_MINI_DEPLOYMENT: ${AZURE_OPENAI_MINI_DEPLOYMENT:-}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
