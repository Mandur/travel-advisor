services:
  advisor-agent:
    image: hacktrial.azurecr.io/advisor-agent:${TAG:-0.0.1}
    build:
      context: .
      dockerfile: advisor/agents/advisor_agent/Dockerfile
    ports:
      - "8088:8088"
    environment:
      AZURE_AI_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_MINI_DEPLOYMENT: ${AZURE_OPENAI_MINI_DEPLOYMENT:-}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      REDIS_URL: ${REDIS_URL:-}
      BEARER_TOKEN: ${BEARER_TOKEN:-}
      RFP_API_BASE_URL: ${RFP_API_BASE_URL:-}
      # Sub-agent dispatch: set URLs for HTTP mode, leave empty for in-process
      RFP_AGENT_URL: http://rfp-agent:8088
      PROPERTY_PLANNING_AGENT_URL: http://property-planning-agent:8088
      # Hotelligence360 — set all three browser-auth vars
      # to have the agent fetch a fresh token at startup via headless Chrome.
      HOTELLIGENCE_GRAPHQL_URL: ${HOTELLIGENCE_GRAPHQL_URL:-}
      WEB_UI_URL: ${WEB_UI_URL:-}
      UI_LOGIN_EMAIL: ${UI_LOGIN_EMAIL:-}
      UI_LOGIN_PASSWORD: ${UI_LOGIN_PASSWORD:-}

  rfp-agent:
    image: hacktrial.azurecr.io/rfp-agent:${TAG:-0.0.1}
    build:
      context: .
      dockerfile: advisor/agents/rfp/Dockerfile
    ports:
      - "8089:8088"
    environment:
      AZURE_AI_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_MINI_DEPLOYMENT: ${AZURE_OPENAI_MINI_DEPLOYMENT:-}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      REDIS_URL: ${REDIS_URL:-}
      BEARER_TOKEN: ${BEARER_TOKEN:-}
      RFP_API_BASE_URL: ${RFP_API_BASE_URL:-}

  property-planning-agent:
    image: hacktrial.azurecr.io/prop-planning-agent:${TAG:-0.0.1}
    build:
      context: .
      dockerfile: advisor/agents/property_planning/Dockerfile
    ports:
      - "8090:8088"
    environment:
      AZURE_AI_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_MINI_DEPLOYMENT: ${AZURE_OPENAI_MINI_DEPLOYMENT:-}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      REDIS_URL: ${REDIS_URL:-}
      HOTELLIGENCE_GRAPHQL_URL: ${HOTELLIGENCE_GRAPHQL_URL:-}
