[project]
name = "hack-trial"
version = "0.1.0"
description = "Multi-agent monorepo for Microsoft Foundry"
requires-python = ">=3.12"
dependencies = [
    "pip-system-certs>=5.3",
]

[tool.uv]
prerelease = "allow"

[tool.uv.workspace]
members = [
    "advisor/shared",
    "advisor/tools/meeting_broker",
    "advisor/tools/travel_advisor",
    "advisor/tools/hotelligence_advisor",
    "advisor/agents/advisor_agent",
    "advisor/agents/rfp",
    "advisor/agents/property_planning",
]

[tool.pyright]
include = ["advisor"]
